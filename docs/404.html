<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Content-Security-Policy. Keep this as the first element after the charset:
    a policy delivered in a meta tag does not apply to anything before it.
    Allows this site's stylesheet, Google Fonts' CSS and font files, and only
    the inline scripts whose SHA-256 hashes are listed. Nothing else may be
    loaded, fetched, embedded or submitted. After editing any inline script,
    including a comment inside one, run tools/csp_hash.py --write to update
    the hashes.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    GitHub Pages serves this file for any path that doesn't exist, at that
    path (e.g. /a/b/c), so every URL here is root-absolute. A <base> tag
    can't help: the CSP sets base-uri 'none'. After five seconds the browser
    goes Home, and Home sends an already-yeeted browser on to gone.html.
    The Founder calls this "the funnel".
  -->
  <meta http-equiv="refresh" content="5; url=/">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="/">Neoyeeter</a>
      <a href="/about.html">About</a>
      <a class="login" href="/reviewing.html">Log in</a>
    </nav>
  </header>
  <main class="page page-center">
    <h1>Oops! You took a wrong turn!</h1>
    <p class="lede">The page you're looking for doesn't exist. We're going to take you home in a few seconds.</p>
  </main>
  <footer class="site-footer">
    <p>Do you think Bono found it yet?</p>
    <p><a href="/privacy.html">Privacy Policy</a> · <a href="/guidelines.html">Community Guidelines</a></p>
  </footer>
</body>
</html>
